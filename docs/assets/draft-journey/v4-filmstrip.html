<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>V4 Filmstrip · Draft journey</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="ss-page">
    <div class="ss-stage">
      <div class="ss-app" data-app data-variant="film">
        <div class="ss-hairline" data-show="edit resume review"></div>
        <div class="ss-review" data-show="review">
          <div class="stripe"></div>
          <span class="pos">Change 1 of 2</span>
          <button class="step" type="button" disabled>‹</button>
          <button class="step" type="button">›</button>
          <span class="kind">Updated · Planner</span>
          <span class="grow"></span>
          <button class="discard" type="button">Discard</button>
          <button class="keep" type="button" data-to="merged">Keep</button>
        </div>
        <div class="ss-canvas">
          <div class="ss-board" data-show="main create return">
            <div class="ss-node" style="left:18%;top:28%"><span class="port out"></span><b>Planner</b><small>route · depth 1</small></div>
            <div class="ss-node" style="left:58%;top:28%"><span class="port in"></span><b>Controller</b><small>command</small></div>
            <span class="ss-wire" style="left:29%;top:38%;width:28%"></span>
          </div>
          <div class="ss-board" data-show="edit resume review merged">
            <div class="ss-node is-changed" style="left:12%;top:18%"><span class="port out"></span><b>Planner v2</b><small>route · renamed</small></div>
            <div class="ss-node is-added" style="left:40%;top:38%"><span class="port in"></span><span class="port out"></span><b>Safety check</b><small>new Block</small></div>
            <div class="ss-node" style="left:68%;top:18%"><span class="port in"></span><b>Controller</b><small>command</small></div>
            <span class="ss-wire is-new" style="left:24%;top:28%;width:18%;transform:rotate(28deg)"></span>
            <span class="ss-wire is-new" style="left:52%;top:34%;width:18%;transform:rotate(-26deg)"></span>
          </div>
        </div>
        <div class="ss-shell ss-shell-left">
          <button class="ss-icon" type="button" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
          <div class="ss-file"><em>◫</em>robot-arm</div>
          <button class="ss-chip" data-show="main create return merged" type="button">
            <svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
            Main
          </button>
          <button class="ss-chip is-draft" data-show="edit resume review" type="button">
            <svg viewBox="0 0 24 24"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
            Draft 1
          </button>
        </div>
        <div class="ss-shell ss-shell-right">
          <button class="ss-icon" type="button" aria-label="Comments"><svg viewBox="0 0 20 20"><path d="M4 5h12v8H8l-4 3V5z"/></svg></button>
          <span class="ss-avatar">Z</span>
          <button class="ss-share" type="button">Share</button>
        </div>
        <div class="ss-film">
          <button class="ss-frame is-on" data-show="main create" type="button">
            <b>Main</b><small>v0.7 · live</small><span class="ss-thumb"></span>
          </button>
          <button class="ss-frame" data-show="main" type="button" data-to="create">
            <b>New draft</b><small>from Main</small><span class="ss-thumb" style="opacity:.45"></span>
          </button>
          <button class="ss-frame is-on" data-show="return merged" type="button" data-to="return">
            <b>Main</b><small data-show="return">unchanged</small><small data-show="merged">v0.8 · Planner v2</small><span class="ss-thumb" data-show="return"></span><span class="ss-thumb is-v2" data-show="merged"></span>
          </button>
          <button class="ss-frame is-draft" data-show="create return" type="button" data-to="resume">
            <b>Draft 1</b><small data-show="create">empty name…</small><small data-show="return">2 changes</small><span class="ss-thumb" data-show="create"></span><span class="ss-thumb is-v2" data-show="return"></span>
          </button>
          <button class="ss-frame is-draft is-on" data-show="edit resume review" type="button">
            <b>try a second planner</b><small>Draft · 2 changes</small><span class="ss-thumb is-v2"></span>
          </button>
          <button class="ss-frame" data-show="edit resume review" type="button" data-to="return">
            <b>Main</b><small>unchanged</small><span class="ss-thumb"></span>
          </button>
          <button class="ss-frame" data-show="merged" type="button">
            <b>Version v0.8</b><small>before the draft</small><span class="ss-thumb"></span>
          </button>
          <button class="ss-frame" data-show="create" type="button" data-to="edit" style="border-style:dashed">
            <b>Create</b><small>try a second planner</small>
          </button>
          <button class="ss-frame" data-show="resume review" type="button" data-to="review">
            <b>Review</b><small>2 changes</small>
          </button>
        </div>
        <div class="ss-tools">
          <button class="is-on" type="button" aria-label="Select">➤</button>
          <button type="button" aria-label="Hand">✋</button>
          <button type="button" aria-label="Block">▢</button>
          <button type="button" aria-label="Text">T</button>
        </div>
        <div class="ss-zoom">100%</div>
      </div>
      <div class="ss-walk" data-walk>
        <button type="button" data-back>← Back</button>
        <div class="chips" data-chips></div>
        <button type="button" data-next>Next →</button>
        <div class="cap" data-cap></div>
      </div>
    </div>
  </div>
  <script src="journey.js"></script>
</body>
</html>
