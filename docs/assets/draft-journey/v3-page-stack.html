<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>V3 Page-stack · Draft journey</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body>
  <div class="ss-page">
    <div class="ss-stage">
      <div class="ss-app has-sheets" data-app data-variant="stack" data-beat-class='{"main":"ss-app has-sheets","create":"ss-app has-sheets","edit":"ss-app has-sheets","return":"ss-app has-sheets","resume":"ss-app has-sheets","review":"ss-app has-sheets","merged":"ss-app has-sheets"}'>
        <div class="ss-hairline" data-show="edit resume review"></div>
        <div class="ss-sheets">
          <button class="ss-sheet" data-show="main create" type="button">Main</button>
          <button class="ss-sheet is-on" data-show="return merged" type="button">Main</button>
          <button class="ss-sheet is-draft" data-show="return" type="button" data-to="resume">Draft 1</button>
          <button class="ss-sheet" data-show="edit resume review" type="button" data-to="return" style="opacity:.7">Main</button>
          <button class="ss-sheet is-draft is-on" data-show="edit resume review" type="button">Draft 1</button>
          <button class="ss-sheet" data-show="merged" type="button">v0.8</button>
          <button class="ss-sheet" data-show="main create" type="button" data-to="create" style="opacity:.72">＋</button>
        </div>
        <div class="ss-review" data-show="review">
          <div class="stripe"></div>
          <span class="pos">Change 1 of 2</span>
          <button class="step" type="button" disabled>‹</button>
          <button class="step" type="button">›</button>
          <span class="kind">Updated · Planner</span>
          <span class="grow"></span>
          <button class="discard" type="button">Discard</button>
          <button class="keep" type="button" data-to="merged">Keep</button>
        </div>
        <div class="ss-canvas">
          <div class="ss-board" data-show="main create return">
            <div class="ss-node" style="left:18%;top:38%"><span class="port out"></span><b>Planner</b><small>route · depth 1</small></div>
            <div class="ss-node" style="left:58%;top:38%"><span class="port in"></span><b>Controller</b><small>command</small></div>
            <span class="ss-wire" style="left:29%;top:48%;width:28%"></span>
          </div>
          <div class="ss-board" data-show="edit resume review merged">
            <div class="ss-node is-changed" style="left:12%;top:30%"><span class="port out"></span><b>Planner v2</b><small>route · renamed</small></div>
            <div class="ss-node is-added" style="left:40%;top:52%"><span class="port in"></span><span class="port out"></span><b>Safety check</b><small>new Block</small></div>
            <div class="ss-node" style="left:68%;top:30%"><span class="port in"></span><b>Controller</b><small>command</small></div>
            <span class="ss-wire is-new" style="left:24%;top:41%;width:18%;transform:rotate(28deg)"></span>
            <span class="ss-wire is-new" style="left:52%;top:48%;width:18%;transform:rotate(-26deg)"></span>
          </div>
        </div>
        <div class="ss-shell ss-shell-left" style="top:52px">
          <button class="ss-icon" type="button" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12"/></svg></button>
          <div class="ss-file"><em>◫</em>robot-arm</div>
          <span class="ss-chip" data-show="main create return merged">Main</span>
          <span class="ss-chip is-draft" data-show="edit resume review">Draft 1</span>
        </div>
        <div class="ss-shell ss-shell-right">
          <button class="ss-icon" type="button" aria-label="Comments"><svg viewBox="0 0 20 20"><path d="M4 5h12v8H8l-4 3V5z"/></svg></button>
          <span class="ss-avatar">Z</span>
          <button class="ss-share" type="button">Share</button>
        </div>
        <div class="ss-name" data-show="create">
          <label>NEW DRAFT</label>
          <input value="try a second planner" readonly>
          <div class="row">
            <button class="ss-btn" type="button" data-to="main">Cancel</button>
            <button class="ss-btn primary" type="button" data-to="edit">Create sheet</button>
          </div>
        </div>
        <aside class="ss-changes" data-show="review">
          <div class="hd"><span>This sheet vs Main</span><span>2</span></div>
          <div class="ss-change upd"><i>✎</i><span><b>Planner</b><small>Renamed to Planner v2</small></span><em>[Block]</em></div>
          <div class="ss-change add"><i>＋</i><span><b>Safety check</b><small>New Block</small></span><em>[Block]</em></div>
        </aside>
        <div class="ss-tools">
          <button class="is-on" type="button" aria-label="Select">➤</button>
          <button type="button" aria-label="Hand">✋</button>
          <button type="button" aria-label="Block">▢</button>
          <button type="button" aria-label="Text">T</button>
        </div>
        <div class="ss-zoom">100%</div>
      </div>
      <div class="ss-walk" data-walk>
        <button type="button" data-back>← Back</button>
        <div class="chips" data-chips></div>
        <button type="button" data-next>Next →</button>
        <div class="cap" data-cap></div>
      </div>
    </div>
  </div>
  <script src="journey.js"></script>
</body>
</html>
